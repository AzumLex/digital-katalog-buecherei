name: Daten und Build prüfen

# Läuft bei jedem Push und bei jedem Pull Request. Schlägt die Datenprüfung fehl,
# schlägt der ganze Lauf fehl — und damit auch die Bedingung, die für einen Merge
# nach main erfüllt sein muss (siehe README, Abschnitt „Veröffentlichen").
on:
  push:
  pull_request:

# Wird während eines laufenden Durchgangs erneut gepusht, wird der alte abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Daten, Build und Prüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Python wird für den Build NICHT gebraucht — nur für die beiden
      # Zusatzprüfungen weiter unten. Auf dem Deploy-Server ist es nirgends nötig.
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          npm ci
          pip install -r requirements.txt

      # Zuerst und für sich allein: Bei kaputten Daten soll die Fehlermeldung ganz
      # oben stehen und nicht in der Build-Ausgabe untergehen. Das ist dieselbe
      # Prüfung, die auch vor jedem Build läuft — in Node, ohne Python.
      - name: Daten gegen das Schema prüfen
        run: npm run validate

      # Gegenprobe mit der Python-Fassung, die für die lokale Arbeit erhalten bleibt.
      # Beide prüfen dasselbe; wenn sie je auseinanderlaufen, fällt es hier auf und
      # nicht erst, wenn jemand sich lokal auf ein falsches „0 Fehler" verlässt.
      - name: Gegenprobe mit validate.py
        run: npm run validate:py

      # Vercel lehnt eine Konfiguration mit einem einzigen unbekannten Schlüssel
      # komplett ab — und zwar erst beim Deploy. Hier fällt es sofort auf.
      - name: vercel.json gegen das Vercel-Schema prüfen
        run: npm run vercelpruefen

      # Prüft nicht die Daten, sondern ihre Schreibweise: dass der Schreibweg der
      # Verwaltung (src/lib/bestand.ts) jede vorhandene Datei byte-gleich zurückgibt.
      # Steht hier oben bei den Datenprüfungen, weil er wie sie nur die JSON-Dateien
      # braucht — keinen Build, kein Netz, eine Sekunde.
      - name: Dateiformat prüfen
        run: npm run formattest

      # Rechnet die Prüfziffer aller hinterlegten ISBN nach und hält den id-Vorschlag
      # gegen die vorhandenen Kennungen. Braucht wie die beiden darüber weder Build
      # noch Netz — die Eingaben sind die Daten selbst.
      - name: ISBN und Kennungen prüfen
        run: npm run isbntest

      - name: Typen prüfen
        run: npm run check

      - name: Website bauen
        run: npm run build

      # Die letzte Sicherung gegen den Fehler aus plan.md § 5, der am teuersten wäre: ein
      # Geheimnis im ausgelieferten Teil. `dist/` ist genau das — der Ordner, den Vercel
      # unverändert ins Netz stellt. Gesucht wird nach den beiden Präfixen, die
      # GitHub-Token tragen, und nach den Namen der Umgebungsvariablen: Steht einer davon
      # im Bündel, hat ein Modul den Weg in den Browser gefunden, der ihn nie nehmen darf.
      #
      # `grep` liefert 1, wenn es nichts findet — hier ist das der Erfolgsfall, deshalb die
      # umgekehrte Prüfung mit `if`. Ohne sie stünde der Schritt bei sauberem Ergebnis auf
      # rot.
      - name: Keine Geheimnisse im ausgelieferten Teil
        run: |
          if grep -rIlE 'github_pat_|ghp_|GITHUB_TOKEN|VERWALTUNG_PASSWORT_HASH|SITZUNG_GEHEIMNIS' dist/; then
            echo "::error::In dist/ steht ein Token-Muster oder der Name einer Geheimnis-Variablen."
            exit 1
          fi
          echo "dist/ ist frei von Token-Mustern."

      - name: Suche prüfen
        run: npm run suchtest

      - name: Filter prüfen
        run: npm run filtertest

      # Damit nachvollziehbar ist, wie groß die Seite geworden ist.
      - name: Umfang berichten
        if: always()
        run: |
          echo "### Umfang des Builds" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Datei | roh | gzip |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for datei in dist/suchindex.json dist/liste/romane.json dist/index.html; do
            if [ -f "$datei" ]; then
              roh=$(wc -c < "$datei")
              gz=$(gzip -c "$datei" | wc -c)
              echo "| $datei | $((roh / 1024)) KB | $((gz / 1024)) KB |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Seiten insgesamt: $(find dist -name index.html | wc -l)" >> "$GITHUB_STEP_SUMMARY"
